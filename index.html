<!DOCTYPE html>
<html>
<head>
  <title>For Mom 💖</title>

  <!-- 📱 Mobile responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: url("background.jpeg") no-repeat center center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.25);
      z-index: 0;
    }

    /* ❤️ Floating hearts */
    .heart {
      position: absolute;
      color: rgba(233, 30, 99, 0.6);
      animation: floatUp 6s linear infinite;
      z-index: 1;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

    /* 📩 Envelope */
    .envelope {
      width: 320px;
      height: 200px;
      background: #ff4d88;
      position: relative;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      z-index: 2;
      transition: transform 0.5s ease;
    }

    .envelope:before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-top: 100px solid #ff80aa;
    }

    .open { transform: scale(0.9); }

    /* 💌 Card */
    .card {
      display: none;
      background: white;
      width: 380px;
      max-width: 92vw;
      padding: 20px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
      z-index: 10;
      max-height: 90vh;
      overflow-y: auto;
    }

    h1 { color: #e91e63; font-size: 22px; }

    .photo {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid #ff69b4;
      margin: 10px 0;
    }

    .message {
      font-size: 15px;
      line-height: 1.6;
      color: #444;
    }

    /* 🖼 Gallery */
    .gallery-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .gallery-grid img {
      width: 85px;
      height: 85px;
      object-fit: cover;
      border-radius: 12px;
      border: 3px solid #ff69b4;
    }

    /* 🔍 Zoom */
    .zoom-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .zoom-overlay.active { display: flex; }

    .zoom-overlay img {
      max-width: 95vw;
      max-height: 95vh;
      border-radius: 10px;
    }

    /* 🎉 Confetti */
    .confetti, .cake {
      position: absolute;
      pointer-events: none;
    }

    /* 🎂 Falling cake animation */
    .cake {
      font-size: 24px;
      animation: fallCake 4s linear forwards;
    }

    @keyframes fallCake {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* 📱 Mobile tweaks */
    @media (max-width: 480px) {
      .envelope {
        width: 260px;
        height: 160px;
      }

      .envelope:before {
        border-left: 130px solid transparent;
        border-right: 130px solid transparent;
        border-top: 80px solid #ff80aa;
      }

      h1 { font-size: 20px; }

      .photo {
        width: 120px;
        height: 120px;
      }

      .card {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<!-- 🎵 Birthday Song -->
<audio id="birthdaySong" loop>
  <source src="birthday song.mp3" type="audio/mpeg">
</audio>

<script>
  window.addEventListener("click", () => {
    document.getElementById("birthdaySong").play();
  }, { once: true });
</script>

<!-- ❤️ Hearts -->
<script>
  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 10 + "px";
    heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }
  setInterval(createHeart, 300);
</script>

<!-- 📩 Envelope -->
<div class="envelope" id="envelope" onclick="openCard()"></div>

<!-- 💌 Card -->
<div class="card" id="card">
  <h1>Happy Birthday Mom 💖</h1>

  <img src="mom.jpeg" class="photo">

  <div class="message">
    Mom,<br><br>
    You are the heart of our home and my greatest blessing.
    Thank you for your endless love, patience, and care. 
    May your day be as wonderful as you are. 
    Baraka na fanaka tele.
    I love you endlessly 💕<br><br>
    — Rebecca
  </div>

  <div class="gallery">
    <h2>Our Memories 💕</h2>
    <div class="gallery-grid">
      <img src="pic1.jpeg" onclick="openZoom(this.src)">
      <img src="pic2.jpeg" onclick="openZoom(this.src)">
  </div>
</div>

<!-- 🔍 Zoom -->
<div class="zoom-overlay" id="zoomOverlay" onclick="closeZoom()">
  <img id="zoomImg">
</div>

<script>
  function openCard() {
    document.getElementById("envelope").classList.add("open");

    setTimeout(() => {
      document.getElementById("envelope").style.display = "none";
      document.getElementById("card").style.display = "block";
    }, 600);

    // 🎉 Confetti
    const symbols = ["💖","💗","✨","🌸","💞"];
    for (let i = 0; i < 40; i++) {
      let c = document.createElement("div");
      c.className = "confetti";
      c.innerHTML = symbols[Math.floor(Math.random()*symbols.length)];
      c.style.left = Math.random() * 100 + "vw";
      c.style.top = "-10vh";
      c.style.fontSize = Math.random() * 10 + 10 + "px";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3000);
    }

    // 🎂 Falling cakes
    for (let i = 0; i < 15; i++) {
      let cake = document.createElement("div");
      cake.className = "cake";
      cake.innerHTML = "🎂";
      cake.style.left = Math.random() * 100 + "vw";
      cake.style.top = "-10vh";
      cake.style.fontSize = (Math.random() * 20 + 20) + "px";
      cake.style.animationDuration = (Math.random() * 2 + 3) + "s";
      document.body.appendChild(cake);
      setTimeout(() => cake.remove(), 4000);
    }
  }

  function openZoom(src) {
    document.getElementById("zoomImg").src = src;
    document.getElementById("zoomOverlay").classList.add("active");
  }

  function closeZoom() {
    document.getElementById("zoomOverlay").classList.remove("active");
  }
</script>

</body>
</html>
